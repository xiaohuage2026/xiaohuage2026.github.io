name: Deploy Hexo

# 当博客源码（blog/**）变更并推送到 main 分支时：
# 1. 构建 Hexo 静态站点
# 2. 用构建产物覆盖仓库根目录（GitHub Pages 从此处发布）
# 3. 若产物有变化则自动提交并推送（Pages 随之更新）
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hexo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        working-directory: blog
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: blog
        run: npx hexo clean && npx hexo generate

      - name: Sync build output to repo root
        run: rsync -a --delete --exclude='.git' --exclude='blog' --exclude='.github' blog/public/ ./

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "chore: deploy $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
